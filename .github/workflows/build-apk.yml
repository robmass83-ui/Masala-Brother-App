name: Build release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Stub Firebase options for analyze
        run: cp lib/firebase_options.example.dart lib/firebase_options.dart

      - run: flutter pub get
      - run: flutter --version
      - run: flutter analyze
      - run: flutter test

      - name: Write Firebase and signing secrets
        env:
          FIREBASE_OPTIONS: ${{ secrets.FIREBASE_OPTIONS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_OPTIONS" > lib/firebase_options.dart
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          if ! grep -q 'class DefaultFirebaseOptions' lib/firebase_options.dart; then
            echo 'FIREBASE_OPTIONS secret is missing class DefaultFirebaseOptions.'
            echo 'Set it to the contents of frontend/lib/firebase_options.dart'
            exit 1
          fi
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo '::error::Missing KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS.'
            echo 'GitHub APKs must be signed with the upload keystore. The CI debug key is a different certificate every run, so Google Sign-In fails (error 10) and updates cannot install over the previous APK.'
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$KEYSTORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=upload-keystore.jks" > android/key.properties

      - run: flutter build apk --release --split-per-abi

      - name: Reject debug-signed APKs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, zipfile, sys
          apks = glob.glob('build/app/outputs/flutter-apk/*-release.apk')
          if not apks:
              print('No release APKs found', file=sys.stderr)
              sys.exit(1)
          for path in apks:
              with zipfile.ZipFile(path) as z:
                  names = [n for n in z.namelist() if n.startswith('META-INF/') and n.endswith(('.RSA', '.DSA', '.EC'))]
                  if not names:
                      print(f'{path}: missing signing cert (v1)', file=sys.stderr)
                      sys.exit(1)
                  data = z.read(names[0])
              if b'Android Debug' in data:
                  print(f'{path} is signed with the Android debug certificate.', file=sys.stderr)
                  sys.exit(1)
              print(f'{path}: release signature ok')
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            frontend/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
